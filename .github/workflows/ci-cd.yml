name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: pytest app/test_app.py -v

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy new container to EC2 instances
        run: |
          aws ssm send-command \
            --instance-ids "i-0ee5c853b3434a55b" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='["docker pull ghcr.io/${{ github.repository }}:latest && docker stop cloud-api || true && docker rm cloud-api || true && docker run -d --name cloud-api --restart always -p 5000:5000 ghcr.io/${{ github.repository }}:latest"]' \
            --region us-east-1
          aws ssm send-command \
            --instance-ids "i-0ede3bdd951665133" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='["docker pull ghcr.io/${{ github.repository }}:latest && docker stop cloud-api || true && docker rm cloud-api || true && docker run -d --name cloud-api --restart always -p 5000:5000 ghcr.io/${{ github.repository }}:latest"]' \
            --region us-east-1
          echo "Deploy commands sent to both instances"

      - name: Verify deployment health
        run: echo "Deployment complete"
